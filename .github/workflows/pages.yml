name: Deploy demo to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm test
      - name: Build library and demo
        run: npm run build
        env:
          DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npx playwright install --with-deps chromium
      - name: Check the published base path in Chromium
        working-directory: apps/charts-demo
        run: PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH" node ../../node_modules/@playwright/test/cli.js test --retries=0
        env:
          CI: 'true'
          DEMO_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/charts-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish demo
        id: deployment
        uses: actions/deploy-pages@v5
